<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sayfa bulunamadı | Hasan Şahin</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./design-system.css">
  <style>
    .not-found { width: min(44rem, calc(100% - 2.5rem)); margin: clamp(3rem, 12vh, 8rem) auto; }
    .not-found .brand { display: inline-block; padding-block: .75rem; margin-bottom: 3rem; }
    .not-found .code { color: var(--color-accent); letter-spacing: .12em; }
    .not-found h1 { font-size: clamp(2rem, 6vw, 3.5rem); line-height: 1.15; margin-block: 1rem; }
    .not-found .description { color: var(--color-secondary); max-width: 36rem; }
    .not-found .return { display: inline-flex; align-items: center; min-height: 48px; padding: .75rem 1.25rem; margin-top: 2rem; border: 1px solid var(--color-accent); color: var(--color-accent); }
    .not-found .return:hover { background: var(--color-accent); color: var(--color-background); }
    .not-found a:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 4px; }
  </style>
</head>
<body>
  <main class="not-found">
    <a class="brand" href="./" aria-label="Hasan Şahin — Ana sayfa">/Hasan Şahin</a>
    <p class="code">404</p>
    <h1>Sayfa bulunamadı.</h1>
    <p class="description">Aradığınız sayfa taşınmış veya adres değişmiş olabilir. Ana sayfadan çalışmalara ve iletişim bilgilerine ulaşabilirsiniz.</p>
    <a class="return" href="./">Ana sayfaya dön ↗</a>
  </main>
</body>
</html>
